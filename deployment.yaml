apiVersion: apps/v1
kind: Deployment
metadata:
  name: #CI_PROJECT_NAME#
  namespace: #CI_PROJECT_ROOT_NAMESPACE#-#CI_PROJECT_NAME#
spec:
  replicas: 2
  selector:
    matchLabels:
      app: #CI_PROJECT_NAME#
  template:
    metadata:
      labels:
        app: #CI_PROJECT_NAME#
    spec:
      containers:
      - name: #CI_PROJECT_NAME#
        image: #CI_REGISTRY_IMAGE#:#CI_COMMIT_SHA#
        ports:
        - containerPort: 8501
      imagePullSecrets:
        - name: registry-gitlab-ipearev
