apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipearev
  labels:
    app.kubernetes.io/name: ipearev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ipearev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipearev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ipearev
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: IPEAREV_ALLOW_CONFIG_PERSISTENCE
              value: "false"
          envFrom:
            - secretRef:
                name: ipearev-runtime
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: __IMAGE_PULL_SECRET__
      volumes:
        - name: tmp
          emptyDir: {}
