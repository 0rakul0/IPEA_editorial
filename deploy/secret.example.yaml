# Não versionar o Secret real. Crie-o no cluster com valores adequados ao provider.
apiVersion: v1
kind: Secret
metadata:
  name: ipearev-runtime
type: Opaque
stringData:
  LLM_PRIMARY_PROVIDER: openai_compatible
  LLM_BASE_URL: https://servidor-interno/v1
  LLM_MODEL: nome-do-modelo
  LLM_API_KEY: substitua-por-um-segredo
  # OPENALEX_API_KEY: opcional
  # OPENALEX_EMAIL: opcional
